name: 'SarembokVE API Contract Gate'
description: 'Autonomous reverse-engineering and contract drift detection gate powered by SarembokVE Playwright engine.'
author: 'Jetson Technologies'
inputs:
  target:
    description: 'Fully qualified URL of the API or web service to audit (e.g. https://api.staging.internal)'
    required: true
  fail_on_drift:
    description: 'Fail the build if verification fails or schema diverges'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Run Sarembok Autonomous Audit
      shell: bash
      run: |
        node ${{ github.action_path }}/bin/sarembok.js audit "${{ inputs.target }}"
