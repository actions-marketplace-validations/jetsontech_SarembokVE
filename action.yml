name: 'SarembokVE Zero-Trust Contract & Governance Gate'
description: 'Continuous API contract drift audit, OpenShell zero-trust boundary verification, and formal runtime governance in CI/CD.'
author: 'Tim Hall (@jetsontech)'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  target:
    description: 'Fully qualified URL or endpoint to audit (e.g. https://staging.example.com)'
    required: true
  baseline:
    description: 'Path to the committed baseline specification file'
    required: false
    default: '.sarembok/baseline.json'
  fail_on_drift:
    description: 'Fail the build on breaking API contract changes ("true" or "false")'
    required: false
    default: 'true'
  profile:
    description: 'OpenShell zero-trust security profile ("strict", "enterprise", "developer", "audit")'
    required: false
    default: 'strict'
  update_baseline:
    description: 'Overwrite the baseline with the current contract ("true" or "false")'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run SarembokVE Contract & Security Gate
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON_DRIFT: ${{ inputs.fail_on_drift }}
        PROFILE: ${{ inputs.profile }}
        UPDATE_BASELINE: ${{ inputs.update_baseline }}
      run: |
        node "${{ github.action_path }}/bin/sarembok-cli.js" openshell profile "$PROFILE" || true
        args=(audit "$TARGET" --baseline "$BASELINE")
        if [ "$FAIL_ON_DRIFT" = "false" ]; then args+=(--no-fail); fi
        if [ "$UPDATE_BASELINE" = "true" ]; then args+=(--update-baseline); fi
        node "${{ github.action_path }}/bin/sarembok-cli.js" "${args[@]}"
