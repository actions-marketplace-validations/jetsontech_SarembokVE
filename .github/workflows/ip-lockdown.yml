name: Enforce IP & Repo Lockdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  enforce-ip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce Open-Core Separation (Remove Proprietary Cloud/OS Modules Moved to Enterprise)
        run: |
          git rm -rf --ignore-unmatch AI backend frontend labs sarembok-os

      - name: Add OPEN_CORE_ARCHITECTURE.md Notice
        run: |
          cat << 'EOF' > OPEN_CORE_ARCHITECTURE.md
          # SarembokVE Open-Core & Commercial Architecture

          This public repository contains the **SarembokVE GitHub Marketplace Action, CLI tool, and core engine pipeline**.

          ### Proprietary Enterprise Modules (`SarembokVE-Enterprise`)
          To protect commercial intellectual property, the following production cloud and OS components are maintained separately:
          * **Sovereign Cloud Control Plane (`server.py` & `Deployment/cloud/`)** - Multi-region orchestration
          * **Multi-Model Cognitive Router & Backend (`backend/` & `AI/`)** - Hosted multi-LLM inference grid
          * **Sarembok OS & Digital-Human Embodiment (`sarembok-os/` & `labs/unreal/`)** - Real-time spatial engine
          EOF

      - name: Commit and Push Open-Core Clean Workspace
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: enforce open-core repository lockdown [skip ci]"
          branch: main
