name: Enforce IP & Repo Lockdown

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  enforce-ip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce Open-Core Separation (Remove Proprietary Cloud/OS Modules Moved to Enterprise)
        run: |
          git rm -rf --ignore-unmatch AI Deployment backend frontend labs sarembok-os server.py

      - name: Add OPEN_CORE_ARCHITECTURE.md Notice
        run: |
          cat << 'EOF' > OPEN_CORE_ARCHITECTURE.md
          # SarembokVE Open-Core & Commercial Architecture

          This public repository contains the **SarembokVE GitHub Marketplace Action, CLI & Core Engine**.

          ### Proprietary Enterprise Modules (`SarembokVE-Enterprise`)
          To protect commercial intellectual property, the following production cloud and OS modules are moved to enterprise:
          * **Sovereign Cloud Control Plane (`server.py` & `Deployment/cloud/`)** – Multi-region cluster orchestrator.
          * **Multi-Model Cognitive Router & Backend (`backend/` & `AI/`)** – Hosted multi-LLM routing & training pipelines.
          * **Sarembok OS & Digital-Human Embodiment (`sarembok-os/` & `labs/unreal/`)** – Enterprise spatial embodiment stack.

          For commercial licensing, enterprise deployments, or managed cloud access, visit [sarembok.com](https://sarembok.com).
          EOF

      - name: Verify Public Marketplace Action & CLI Test Suite Passes
        run: |
          npm ci
          npm test

      - name: Commit and Push Open-Core Separation
        run: |
          git config user.name "Timothy Hall Jr. (Jetsontech)"
          git config user.email "timothy@jetsontech.com"
          git commit -am "chore: enforce open-core repository separation" || exit 0
          git push origin main
