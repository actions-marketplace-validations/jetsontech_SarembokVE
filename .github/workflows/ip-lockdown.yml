name: Open-Core IP Lockdown & Verification
on:
  push:
    branches: [main]
  pull_request:

jobs:
  enforce-ip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce Open-Core Separation (Remove Proprietary Cloud/OS Modules Moved to Enterprise)
        run: |
          git rm -rf --ignore-unmatch AI Deployment backend frontend labs sarembok-os server.py

      - name: Add OPEN_CORE_ARCHITECTURE.md Notice
        run: |
          cat << 'EOF' > OPEN_CORE_ARCHITECTURE.md
          # SarembokVE Open-Core & Commercial Architecture

          **Copyright (c) 2026 Timothy Hall Jr. / Jetsontech. All rights reserved.**

          This public repository contains the **SarembokVE GitHub Marketplace Action, CLI, and Core Engine**.

          ### Proprietary Enterprise Modules (`SarembokVE-Enterprise`)
          To protect commercial intellectual property, the following production cloud and OS modules reside in private repositories:
          * **Sovereign Cloud Control Plane (`server.py` & `Deployment/cloud/`)** – Multi-cloud tenant orchestration & VPC isolated clusters.
          * **Multi-Model Cognitive Router & Backend (`backend/` & `AI/`)** – Hosted multi-LLM routing, private model adapters, & commercial prompt caching.
          * **Sarembok OS & Digital-Human Embodiment (`sarembok-os/` & `labs/unreal/`)** – Spatial computing, Unreal Engine live avatars, & OS daemon integration.

          For commercial licensing, enterprise deployments, or managed cloud access, visit [jetsontech.ai](https://jetsontech.ai).
          EOF

      - name: Verify Public Marketplace Action & CLI Test Suite Passes
        run: |
          npm ci
          npm test

      - name: Commit and Push Open-Core Separation
        run: |
          git config user.name "Timothy Hall Jr. (Jetsontech)"
          git config user.email "tech@jetsontech.ai"
          git add OPEN_CORE_ARCHITECTURE.md
          git commit -m "chore(open-core): enforce IP separation and add OPEN_CORE_ARCHITECTURE.md" || true
          git push
