name: SarembokVE IP & BSL-1.1 Lockdown

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enforce-ip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enforce Open-Core Separation (Remove Proprietary Cloud/OS Modules Moved to Enterprise Vault)
        run: |
          git rm -rf --ignore-unmatch AI Deployment backend frontend labs sarembok-os server.py .vsconfig

      - name: Add OPEN_CORE_ARCHITECTURE.md Notice
        run: |
          cat << 'EOF' > OPEN_CORE_ARCHITECTURE.md
          # SarembokVE Open-Core & Commercial Architecture

          **Copyright (c) 2026 Timothy Hall Jr. / Jetsontech. All rights reserved.**

          This public repository contains the **SarembokVE GitHub Marketplace Action, CLI (`npx sarembok`), Zero-Trust OpenShell Supervisor, Contract Drift Gate, and Local SDK** licensed under the **Business Source License 1.1 (BSL-1.1)**.

          ### Proprietary Enterprise Modules (`SarembokVE-Enterprise`)
          To protect commercial intellectual property, the following production cloud and sovereign control-plane subsystems are maintained exclusively in the private **SarembokVE-Enterprise** vault and hosted at [sarembok.com](https://sarembok.com):
          * **Sovereign Cloud Control Plane (`server.py` & `Deployment/cloud/`)** — Multi-sector real-time parallel fan-out engine and production cluster broker.
          * **Multi-Model Cognitive Router & Backend (`backend/` & `AI/`)** — Hosted multi-provider fallback routing and enterprise orchestration.
          * **Sarembok OS & Digital-Human Embodiment (`sarembok-os/` & `labs/unreal/`)** — Native OS substrate and Unreal Engine 5.x MetaHuman bridge.

          For commercial licensing, enterprise deployments, or managed cloud access, visit [sarembok.com](https://sarembok.com) or contact **Timothy Hall Jr. / Jetsontech**.
          EOF

      - name: Verify Public Marketplace Action & CLI Test Suite Passes
        run: |
          npm ci
          npm test

      - name: Commit and Push Open-Core Separation
        run: |
          git config user.name "Timothy Hall Jr. (Jetsontech)"
          git config user.email "jetsontech@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore(open-core): isolate public Marketplace CLI/Action from private Enterprise Vault modules"
          git push origin HEAD:main
