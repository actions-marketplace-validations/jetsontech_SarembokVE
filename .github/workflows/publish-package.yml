name: Publish Package

on:
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pre-publish verification gate (Unit Tests & Quickstart)
        run: |
          npm test
          npm run quickstart

      - name: Publish to GitHub Packages
        run: |
          npm pkg set name="@jetsontech/sarembok"
          npm pkg set publishConfig.registry="https://npm.pkg.github.com"
          npm config set @jetsontech:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}
          npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Public NPM Registry
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          npm pkg set name="sarembok"
          npm pkg set publishConfig.registry="https://registry.npmjs.org"
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
