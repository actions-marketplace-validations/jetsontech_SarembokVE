<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SarembokVE — Live Terminal Simulator & Command Outcomes Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090c10;
      --bg-surface: #0d1117;
      --bg-surface-elevated: #161b22;
      --bg-card: #1c2129;
      --border: #30363d;
      --border-accent: #388bfd;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --accent-green: #3fb950;
      --accent-cyan: #58a6ff;
      --accent-purple: #bc8cff;
      --accent-gold: #d29922;
      --accent-red: #f85149;
      --accent-gradient: linear-gradient(135deg, #58a6ff 0%, #bc8cff 50%, #3fb950 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    header {
      background: rgba(13, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--accent-gradient);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
      font-size: 16px;
      box-shadow: 0 0 16px rgba(88, 166, 255, 0.35);
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      background: rgba(56, 139, 253, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(56, 139, 253, 0.3);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--bg-surface-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: #21262d;
      border-color: #8b949e;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
      box-shadow: 0 2px 8px rgba(35, 134, 54, 0.4);
    }

    .btn-primary:hover {
      background: #2ea043;
      border-color: #3fb950;
    }

    .btn-danger {
      background: rgba(248, 81, 73, 0.1);
      border-color: rgba(248, 81, 73, 0.4);
      color: var(--accent-red);
    }

    .btn-danger:hover {
      background: rgba(248, 81, 73, 0.2);
    }

    /* Main Container */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 20px;
      padding: 20px;
      max-width: 1720px;
      margin: 0 auto;
      width: 100%;
    }

    /* Left Pane: Terminal Simulation */
    .terminal-container {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      height: calc(100vh - 170px);
      min-height: 580px;
    }

    .terminal-header {
      background: var(--bg-surface-elevated);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

    .terminal-title {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .terminal-actions {
      display: flex;
      gap: 6px;
    }

    .terminal-badge {
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .terminal-body {
      flex: 1;
      padding: 18px 20px;
      font-family: 'Fira Code', monospace;
      font-size: 13.5px;
      line-height: 1.6;
      color: #e6edf3;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .terminal-body::-webkit-scrollbar {
      width: 8px;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .term-prompt {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .term-cmd {
      color: #fff;
      font-weight: 600;
    }

    .term-success { color: var(--accent-green); }
    .term-error { color: var(--accent-red); }
    .term-warning { color: var(--accent-gold); }
    .term-info { color: var(--accent-cyan); }
    .term-purple { color: var(--accent-purple); }
    .term-dim { color: var(--text-dim); }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background: var(--accent-cyan);
      vertical-align: middle;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Right Pane: End-User Perspective & Explainer */
    .explainer-container {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      height: calc(100vh - 170px);
      min-height: 580px;
    }

    .explainer-header {
      background: var(--bg-surface-elevated);
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .explainer-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .step-indicator {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Mode Switcher Tabs */
    .mode-switcher {
      display: flex;
      background: var(--bg-base);
      border-radius: 8px;
      padding: 3px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .mode-tab {
      flex: 1;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-tab.active-nominal {
      background: rgba(63, 185, 80, 0.15);
      color: var(--accent-green);
      border: 1px solid rgba(63, 185, 80, 0.3);
    }

    .mode-tab.active-failure {
      background: rgba(248, 81, 73, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(248, 81, 73, 0.3);
    }

    .explainer-content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .explainer-content::-webkit-scrollbar {
      width: 8px;
    }
    .explainer-content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .pill-tier {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 20px;
      width: fit-content;
    }

    .pill-tier-1 { background: rgba(56, 139, 253, 0.15); color: #58a6ff; border: 1px solid rgba(56, 139, 253, 0.3); }
    .pill-tier-2 { background: rgba(188, 140, 255, 0.15); color: #bc8cff; border: 1px solid rgba(188, 140, 255, 0.3); }
    .pill-tier-3 { background: rgba(63, 185, 80, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
    .pill-hitl { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }

    .command-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .command-text {
      font-family: 'Fira Code', monospace;
      font-size: 12.5px;
      color: #79c0ff;
      word-break: break-all;
    }

    .card-section {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-section-title {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-section-body {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-main);
    }

    .card-section-body ul {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .outcome-highlight {
      background: rgba(63, 185, 80, 0.08);
      border-left: 3px solid var(--accent-green);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 13px;
    }

    .outcome-violation {
      background: rgba(248, 81, 73, 0.08);
      border-left: 3px solid var(--accent-red);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      font-size: 13px;
    }

    .failure-card {
      background: rgba(248, 81, 73, 0.05);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .failure-reason-box {
      background: var(--bg-card);
      border-left: 3px solid var(--accent-gold);
      padding: 10px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 12.5px;
    }

    .failure-res-box {
      background: rgba(63, 185, 80, 0.08);
      border-left: 3px solid var(--accent-green);
      padding: 10px 12px;
      border-radius: 0 6px 6px 0;
      font-size: 12.5px;
    }

    .code-inline {
      font-family: 'Fira Code', monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: #79c0ff;
    }

    /* Bottom Command Carousel / Nav */
    .command-nav {
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .command-nav::-webkit-scrollbar {
      height: 6px;
    }
    .command-nav::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .nav-pill {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: 'Fira Code', monospace;
    }

    .nav-pill:hover {
      background: #21262d;
      color: var(--text-main);
      border-color: #8b949e;
    }

    .nav-pill.active {
      background: rgba(56, 139, 253, 0.2);
      border-color: var(--accent-cyan);
      color: var(--text-main);
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.25);
    }

    .nav-pill-num {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    .view-mode-tabs {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .view-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .view-tab.active {
      background: var(--bg-surface-elevated);
      color: var(--accent-cyan);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    .channel-btn {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .channel-btn:hover {
      color: var(--text-main);
      border-color: #8b949e;
    }

    .channel-btn.active {
      background: rgba(56, 139, 253, 0.2);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    .video-viewport {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: radial-gradient(circle at center, #0e131b 0%, #040609 100%);
      overflow: hidden;
      position: relative;
    }

    .video-viewport img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      border: 1px solid var(--border);
      object-fit: contain;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">S</div>
      <div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="brand-title">SarembokVE v3.0.0</span>
          <span class="brand-badge">Interactive Terminal Simulator</span>
        </div>
        <div style="font-size: 11px; color: var(--text-muted);">Modular AI-Native Computing Environment & Zero-Trust Supervisor</div>
      </div>
    </div>

    <div class="header-controls">
      <button class="btn" id="btn-prev" onclick="prevStep()">⏮ Previous</button>
      <button class="btn btn-primary" id="btn-play" onclick="toggleAutoPlay()">▶ Play Simulation</button>
      <button class="btn btn-next" onclick="nextStep()">⏭ Next</button>
      <button class="btn" style="background: rgba(88, 166, 255, 0.15); border-color: rgba(88, 166, 255, 0.4); color: var(--accent-cyan);" onclick="switchMainView('video')">🎬 Watch Demo Video</button>
      <button class="btn btn-danger" onclick="resetTerminal()">↺ Reset</button>
    </div>
  </header>

  <main>
    <!-- Left: Terminal Simulation & Video Player -->
    <section class="terminal-container">
      <div class="terminal-header">
        <div class="traffic-lights">
          <div class="dot dot-red"></div>
          <div class="dot dot-yellow"></div>
          <div class="dot dot-green"></div>
        </div>
        <div class="terminal-title">
          <span>bash — sarembok@node: ~/SarembokVE</span>
          <span class="terminal-badge" id="term-status-badge">READY</span>
        </div>
        <div class="terminal-actions">
          <div class="view-mode-tabs">
            <button class="view-tab active" id="tab-term" onclick="switchMainView('terminal')">💻 Terminal</button>
            <button class="view-tab" id="tab-vid" onclick="switchMainView('video')">🎬 Live Video</button>
          </div>
          <span class="terminal-badge" id="term-mode-badge">MODE: NOMINAL</span>
          <span class="terminal-badge">Node v24.11.1</span>
        </div>
      </div>

      <!-- Interactive Terminal View -->
      <div class="terminal-body" id="term-output"></div>

      <!-- Embedded Video Player View -->
      <div id="term-video-view" style="display: none; flex: 1; flex-direction: column; overflow: hidden; background: #000;">
        <div style="background: var(--bg-surface-elevated); padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
          <div style="font-size: 11.5px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 6px;">
            <span>ACTIVE RECORDING:</span>
            <span id="current-channel-label" style="color: var(--accent-cyan); font-family: 'Fira Code', monospace;">Troubleshooting & Failure Modes Tour</span>
          </div>
          <div style="display: flex; gap: 6px;">
            <button class="channel-btn active" id="chan-fail" onclick="changeVideoChannel('videos/sarembok_cli_troubleshooting_demo.webp', 'Troubleshooting & Failure Modes Tour', this)">⚠️ Troubleshooting Demo</button>
            <button class="channel-btn" id="chan-nom" onclick="changeVideoChannel('videos/sarembok_terminal_simulation_tour.webp', 'Nominal CLI Execution Tour', this)">✔ Nominal Tour</button>
            <button class="channel-btn" id="chan-pkg" onclick="changeVideoChannel('videos/sarembok_npm_package_walkthrough.webp', 'GitHub NPM Registry Walkthrough', this)">📦 NPM Package Tour</button>
          </div>
        </div>
        <div class="video-viewport">
          <img id="main-video-element" src="videos/sarembok_cli_troubleshooting_demo.webp" alt="SarembokVE Live Simulation Video">
        </div>
      </div>
    </section>

    <!-- Right: Explainer Panel -->
    <section class="explainer-container">
      <div class="explainer-header">
        <div class="explainer-title">
          <span>💡 Command Deep-Dive, Outcomes & Troubleshooting</span>
        </div>
        <div class="step-indicator" id="step-count">Step 1 of 16</div>
      </div>

      <div class="explainer-content" id="explainer-view">
        <!-- Injected via JavaScript -->
      </div>
    </section>
  </main>

  <!-- Bottom Command Carousel -->
  <nav class="command-nav" id="command-nav-bar">
    <!-- Injected via JavaScript -->
  </nav>

      {

    let currentStep = 0;
    let viewMode = 'nominal'; // 'nominal' or 'failure'
    let isAutoPlaying = false;
    let autoPlayTimer = null;

    // Render Navigation Pills
    function initNav() {
      const nav = document.getElementById("command-nav-bar");
      nav.innerHTML = COMMAND_DATA.map((item, idx) => `
        <div class="nav-pill ${idx === 0 ? 'active' : ''}" id="pill-${idx}" onclick="goToStep(${idx})">
          <span class="nav-pill-num">${idx + 1}</span>
          <span>${item.name}</span>
        </div>
      `).join("");
    }

    // ANSI parser to HTML
    function formatAnsi(text) {
      return text
        .replace(/\x1b\[31m/g, '<span class="term-error">')
        .replace(/\x1b\[32m/g, '<span class="term-success">')
        .replace(/\x1b\[33m/g, '<span class="term-warning">')
        .replace(/\x1b\[35m/g, '<span class="term-purple">')
        .replace(/\x1b\[36m/g, '<span class="term-info">')
        .replace(/\x1b\[0m/g, '</span>');
    }

    function setViewMode(mode) {
      viewMode = mode;
      renderStep(currentStep);
    }

    function renderStep(idx) {
      currentStep = idx;
      const data = COMMAND_DATA[idx];

      // Update Step Counter
      document.getElementById("step-count").innerText = `Step ${idx + 1} of ${COMMAND_DATA.length}`;

      // Update Nav Pills
      document.querySelectorAll(".nav-pill").forEach((el, i) => {
        el.classList.toggle("active", i === idx);
      });

      // Update Mode Badge in Terminal
      const modeBadge = document.getElementById("term-mode-badge");
      if (viewMode === 'nominal') {
        modeBadge.innerText = "MODE: NOMINAL RUN";
        modeBadge.style.color = "var(--accent-green)";
      } else {
        modeBadge.innerText = "MODE: FAILURE SIMULATION";
        modeBadge.style.color = "var(--accent-red)";
      }

      // Build Explainer HTML
      const explainer = document.getElementById("explainer-view");
      explainer.innerHTML = `
        <div class="mode-switcher">
          <div class="mode-tab ${viewMode === 'nominal' ? 'active-nominal' : ''}" onclick="setViewMode('nominal')">
            <span>✔ Expected / Nominal Run</span>
          </div>
          <div class="mode-tab ${viewMode === 'failure' ? 'active-failure' : ''}" onclick="setViewMode('failure')">
            <span>⚠️ Failure Mode & Resolution</span>
          </div>
        </div>

        <div>
          <span class="pill-tier ${data.tierClass}">${data.tier}</span>
          <h2 style="font-size: 19px; font-weight: 700; margin-top: 6px;">${data.name.toUpperCase()}</h2>
        </div>

        <div class="command-box">
          <span class="command-text">${data.command}</span>
          <button class="btn" style="padding: 4px 10px; font-size: 11px;" onclick="copyCmd('${data.command}')">Copy</button>
        </div>

        <div class="card-section">
          <div class="card-section-title">🎯 Purpose (What it does)</div>
          <div class="card-section-body">${data.purpose}</div>
        </div>

        ${viewMode === 'nominal' ? `
          <div class="card-section">
            <div class="card-section-title">📊 Specific Outcome & Output</div>
            <div class="card-section-body">
              <div class="${data.outcomeType === 'violation' ? 'outcome-violation' : 'outcome-highlight'}">
                ${data.outcome}
              </div>
            </div>
          </div>

          <div class="card-section">
            <div class="card-section-title">💡 End-User Perspective (Why & When You Use It)</div>
            <div class="card-section-body">
              <p style="margin-bottom: 8px;"><strong>Use Case:</strong> ${data.endUserPerspective}</p>
              <ul>
                ${data.whyUseIt.map(item => `<li>${item}</li>`).join("")}
              </ul>
            </div>
          </div>
        ` : `
          <div class="failure-card">
            <div style="font-size: 13.5px; font-weight: 700; color: var(--accent-red); display: flex; align-items: center; gap: 6px;">
              <span>🚨 Failure Mode:</span> ${data.failure.errorTitle}
            </div>

            <div class="failure-reason-box">
              <div style="font-weight: 700; color: var(--accent-gold); margin-bottom: 4px;">🔍 Root Cause / Reason:</div>
              <div>${data.failure.reason}</div>
            </div>

            <div class="failure-res-box">
              <div style="font-weight: 700; color: var(--accent-green); margin-bottom: 4px;">🛠️ Resolution & Actionable Fix:</div>
              <div style="white-space: pre-wrap; font-family: 'Fira Code', monospace; font-size: 12px; line-height: 1.5;">${data.failure.resolution}</div>
            </div>
          </div>
        `}
      `;

      // Render Terminal Output
      const term = document.getElementById("term-output");
      term.innerHTML = "";
      
      if (viewMode === 'nominal') {
        if (idx > 0) {
          term.innerHTML += `<div class="term-dim"># [Nominal execution. Showing Step ${idx + 1}]</div>\n`;
        }
        data.terminalOutput.forEach(line => {
          term.innerHTML += `<div>${formatAnsi(line)}</div>`;
        });
        document.getElementById("term-status-badge").innerText = data.outcomeType === 'violation' ? 'BLOCKED (403)' : 'SUCCESS (200)';
        document.getElementById("term-status-badge").style.color = data.outcomeType === 'violation' ? 'var(--accent-red)' : 'var(--accent-green)';
      } else {
        term.innerHTML += `<div class="term-dim"># [Simulated Failure Mode & Resolution for Step ${idx + 1}]</div>\n`;
        data.failure.terminalOutput.forEach(line => {
          term.innerHTML += `<div>${formatAnsi(line)}</div>`;
        });
        document.getElementById("term-status-badge").innerText = 'FAILURE (500/ERR)';
        document.getElementById("term-status-badge").style.color = 'var(--accent-red)';
      }

      term.innerHTML += `<div><span class="term-prompt">sarembok@mesh:~/SarembokVE$ </span><span class="cursor"></span></div>`;
      term.scrollTop = term.scrollHeight;
    }

    function goToStep(idx) {
      renderStep(idx);
    }

    function nextStep() {
      if (currentStep < COMMAND_DATA.length - 1) {
        renderStep(currentStep + 1);
      } else {
        renderStep(0);
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        renderStep(currentStep - 1);
      } else {
        renderStep(COMMAND_DATA.length - 1);
      }
    }

    function toggleAutoPlay() {
      const btn = document.getElementById("btn-play");
      if (isAutoPlaying) {
        clearInterval(autoPlayTimer);
        isAutoPlaying = false;
        btn.innerText = "▶ Play Simulation";
        btn.classList.remove("btn-danger");
        btn.classList.add("btn-primary");
      } else {
        isAutoPlaying = true;
        btn.innerText = "⏸ Pause Simulation";
        btn.classList.remove("btn-primary");
        btn.classList.add("btn-danger");
        autoPlayTimer = setInterval(() => {
          nextStep();
        }, 3400);
      }
    }

    function resetTerminal() {
      if (isAutoPlaying) toggleAutoPlay();
      viewMode = 'nominal';
      renderStep(0);
    }

    function copyCmd(cmd) {
      navigator.clipboard.writeText(cmd);
      alert("Copied to clipboard: " + cmd);
    }

    function switchMainView(view) {
      const termOutput = document.getElementById("term-output");
      const videoView = document.getElementById("term-video-view");
      const tabTerm = document.getElementById("tab-term");
      const tabVid = document.getElementById("tab-vid");

      if (view === 'video') {
        termOutput.style.display = 'none';
        videoView.style.display = 'flex';
        tabTerm.classList.remove('active');
        tabVid.classList.add('active');
      } else {
        termOutput.style.display = 'block';
        videoView.style.display = 'none';
        tabTerm.classList.add('active');
        tabVid.classList.remove('active');
      }
    }

    function changeVideoChannel(src, label, btn) {
      document.getElementById("main-video-element").src = src;
      document.getElementById("current-channel-label").innerText = label;
      document.querySelectorAll(".channel-btn").forEach(el => el.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }

    // Initialize
    initNav();
    renderStep(0);
  </script>
